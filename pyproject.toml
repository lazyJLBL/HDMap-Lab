[project]
name = "hdmap-lab"
version = "1.0.0"
description = "Computational geometry based map algorithm workbench for HD map and road-network experiments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HDMap-Lab" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "psutil>=6.0.0",
]
vis = [
  "matplotlib>=3.9.0",
]
bench = [
  "pandas>=2.2.0",
  "matplotlib>=3.9.0",
  "psutil>=6.0.0",
]
postgis = [
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
hdmap-prepare-osm = "scripts.prepare_osm_extract:main"
hdmap-spatial-benchmark = "benchmarks.spatial_index_benchmark:main"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app", "benchmarks", "scripts"]
omit = ["frontend/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
